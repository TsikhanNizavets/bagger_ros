bucket_wheel_mux:
  ros__parameters:
    output_topic: "bucket_wheel_cmd"
    default_values:
      dof_names: ["bucket_wheel_joint"]
      values: [0.0]       # values_dot left out, because PID doesn't need them
    publish_rate_hz: 20.0
    sources:
      teleop:
        topic: "bucket_wheel_cmd_teleop"
        priority: 10
        timeout: 0.5
      unloader:
        topic: "bucket_wheel_cmd_priority"
        priority: 100
        timeout: 0.5
      autonomy:
        topic: "bucket_wheel_cmd_autonomy"
        priority: 100
        timeout: 0.5

